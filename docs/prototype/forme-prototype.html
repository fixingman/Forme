const images={leather:'https://images.unsplash.com/photo-1529139574466-a303027c1d8b?w=600&auto=format&fit=crop',coat:'https://images.unsplash.com/photo-1539533018447-63fcce2678e3?w=600&auto=format&fit=crop',denim:'https://images.unsplash.com/photo-1542272604-787c3835535d?w=600&auto=format&fit=crop',sneaker:'https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop',shirt:'https://images.unsplash.com/photo-1598032895397-b9472444bf93?w=600&auto=format&fit=crop',knit:'https://images.unsplash.com/photo-1576566588028-4147f3842f27?w=600&auto=format&fit=crop',boots:'https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=600&auto=format&fit=crop',bag:'https://images.unsplash.com/photo-1547949003-9792a18a2601?w=600&auto=format&fit=crop',jacket:'https://images.unsplash.com/photo-1551028719-00167b16eac5?w=600&auto=format&fit=crop',trousers:'https://images.unsplash.com/photo-1473966968600-fa801b869a1a?w=600&auto=format&fit=crop',watch:'https://images.unsplash.com/photo-1524592094714-0f0654e20314?w=600&auto=format&fit=crop',hoodie:'https://images.unsplash.com/photo-1556821840-3a63f95609a7?w=600&auto=format&fit=crop'};
const items=[['Our Legacy','Leather Jacket',2800,'M','Leather','Minimalism',2,8,'leather'],['Margaret Howell','Wool Knit',650,'L','Knitwear','Minimalism',1,4,'knit'],['Yohji Yamamoto','Wide Leg Trousers',3200,'M','Trousers','Japanese Designers',2,9,'trousers'],['Arc’teryx','Technical Shell',4900,'M','Outerwear','Techwear',0,8,'jacket'],['Comme des Garçons','Structured Coat',2100,'L','Outerwear','Japanese Designers',1,9,'coat'],['Our Legacy','Evening Shirt',850,'M','Shirts','Minimalism',0,4,'shirt'],['Guidi','Leather Boots',3600,'42','Footwear','Japanese Designers',1,9,'boots'],['Acne Studios','Denim Jeans',900,'32','Denim','Denim',2,5,'denim'],['Issey Miyake','Pleated Trousers',2700,'M','Trousers','Japanese Designers',1,9,'trousers'],['Helmut Lang','Archive Jacket',6500,'M','Outerwear','Archive',0,10,'jacket'],['Maison Margiela','Replica Sneakers',1400,'42','Footwear','Minimalism',2,6,'sneaker'],['Stone Island','Vintage Hoodie',1100,'L','Knitwear','Workwear',1,6,'hoodie'],['Carhartt WIP','Chore Coat',750,'L','Outerwear','Workwear',2,4,'coat'],['Lemaire','Crossbody Bag',1850,'One size','Accessories','Minimalism',0,7,'bag'],['Rick Owens','Leather Jacket',5800,'L','Leather','Archive',1,10,'leather'],['Prada','Vintage Watch',1800,'One size','Accessories','Archive',2,8,'watch'],['Zara','Tailored Jacket',380,'M','Outerwear','Minimalism',1,2,'coat'],['Shein','Wide Leg Trousers',120,'M','Trousers','Japanese Designers',0,1,'trousers'],['H&M','Wool Blend Knit',190,'L','Knitwear','Minimalism',1,2,'knit'],['Dries Van Noten','Patterned Shirt',1250,'M','Shirts','Archive',2,8,'shirt']].map((x,i)=>({id:i+1,brand:x[0],title:x[1],price:x[2],size:x[3],category:x[4],style:x[5],age:x[6],rarity:x[7],image:x[8]}));
const defaults={following:['Our Legacy','Yohji Yamamoto','Comme des Garçons','Issey Miyake','Helmut Lang','Maison Margiela','Margaret Howell'],excluded:['Zara','Shein','H&M'],styles:['Minimalism','Japanese Designers','Workwear','Techwear','Archive','Denim'],searches:[{id:1,name:'Leather jackets',keyword:'leather',max:7000,size:'',brand:'',alerts:true},{id:2,name:'Japanese trousers',keyword:'trousers',max:4000,size:'M',brand:'',alerts:true},{id:3,name:'Vintage accessories',keyword:'',max:2500,size:'',brand:'',alerts:false}],saved:[],digest:{following:true,searches:true,rare:true,styles:true},digestTime:'09:00',lastVisit:0};
let data;try{data={...defaults,...JSON.parse(localStorage.getItem('forme-v1')||'{}')}}catch{data=structuredClone(defaults)};let page='Discover',styleFilter='All',brandTab='All',query='',activeSearch=null,modal='',toast='',editSearch=null;const nav=[['Discover','⌕'],['Following','♡'],['Saved Searches','▤'],['Rare Finds','◇'],['Daily Drops','◷'],['My Styles','◈'],['Brands','☷'],['Saved Items','♥'],['Settings','⚙']];
function persist(){localStorage.setItem('forme-v1',JSON.stringify(data))}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notify(t){toast=t;render();setTimeout(()=>{toast='';render()},2300)}function visible(){return items.filter(x=>!data.excluded.includes(x.brand))}function filteredSearch(s){return visible().filter(x=>(!s.keyword||`${x.brand} ${x.title} ${x.category} ${x.style}`.toLowerCase().includes(s.keyword.toLowerCase()))&&(!s.max||x.price<=+s.max)&&(!s.size||x.size.toLowerCase().includes(s.size.toLowerCase()))&&(!s.brand||x.brand.toLowerCase().includes(s.brand.toLowerCase())))}function grid(list){if(!list.length)return '<div class="empty">No matching items. Try changing your filters or brand exclusions.</div>';return '<div class="grid">'+list.map(x=>`<article class="product"><div class="photo"><img src="${images[x.image]}" alt="Illustrative ${esc(x.title)}" loading="lazy">${data.following.includes(x.brand)?'<span class="flag">Following</span>':x.rarity>=9?'<span class="flag rare">Rare find</span>':x.age===0?'<span class="flag new">New today</span>':''}<button class="heart ${data.saved.includes(x.id)?'saved':''}" onclick="toggleSave(${x.id})" aria-label="Save item">${data.saved.includes(x.id)?'♥':'♡'}</button></div><div class="productmeta"><strong>${esc(x.brand)}</strong><div class="title">${esc(x.title)}</div><div class="small muted">${esc(x.size)} · ${esc(x.category)}</div><div class="price">${x.price.toLocaleString('sv-SE')} kr</div><div class="bottom"><span>${x.age===0?'Today':x.age+'d ago'}</span><span>${x.rarity>=8?'◇ Rarity '+x.rarity+'/10':''}</span></div></div></article>`).join('')+'</div>'}function header(title,desc,button=''){return `<div class="head"><div><h1>${title}</h1><p>${desc}</p></div>${button}</div>`}function chips(values,selected,func){return `<div class="toolbar">${values.map(s=>`<button class="chip ${selected===s?'active':''}" onclick="${func}('${encodeURIComponent(s)}')">${esc(s)}</button>`).join('')}</div>`}function title(t){return `<h2 class="sectionlabel">${t}</h2>`}
function mainContent(){let list=visible();if(page==='Discover'){if(styleFilter!=='All')list=list.filter(x=>x.style===styleFilter);list=list.sort((a,b)=>(+data.following.includes(b.brand)-+data.following.includes(a.brand))||b.rarity-a.rarity);return header('Discover','Curated secondhand fashion. Your styles, your brands, your rules.')+chips(['All',...data.styles],styleFilter,'setStyle')+grid(list)}if(page==='Following'){list=list.filter(x=>data.following.includes(x.brand)).sort((a,b)=>a.age-b.age);return header('Following','A dedicated feed containing only brands you follow.',`<button class="btn light" onclick="navigate('Brands')">Manage brands</button>`)+`<div class="notice">${data.following.length} followed brands · ${list.filter(x=>x.age===0).length} example listings marked new today</div>`+grid(list)}if(page==='Rare Finds'){list=list.filter(x=>x.rarity>=8).sort((a,b)=>b.rarity-a.rarity);return header('Rare Finds','Potentially scarce pieces ranked with illustrative rarity scores.')+'<div class="notice">Prototype rarity scores are manually assigned to sample listings. Real scoring requires listing history and verifiable market data.</div>'+grid(list)}if(page==='Saved Items'){return header('Saved Items','Pieces you have bookmarked in this browser.')+grid(list.filter(x=>data.saved.includes(x.id)))}if(page==='Saved Searches'){if(activeSearch!==null){let s=data.searches.find(s=>s.id===activeSearch);if(!s){activeSearch=null;return mainContent()}return header(esc(s.name),`Your saved search · ${filteredSearch(s).length} matching sample listings`,`<button class="btn light" onclick="activeSearch=null;render()">← All searches</button>`)+`<div class="toolbar"><button class="chip" onclick="openSearch(${s.id})">Edit search</button><button class="chip" onclick="toggleSearchAlert(${s.id})">${s.alerts?'◉ Digest on':'○ Digest off'}</button></div>`+grid(filteredSearch(s))}return header('Saved Searches','Your specific searches, each with its own matching feed.',`<button class="btn" onclick="openSearch()">+ New search</button>`)+`<div class="cards">${data.searches.map(s=>`<div class="tile" onclick="activeSearch=${s.id};render()"><span class="eyebrow">${s.alerts?'◉ Included in digest':'○ Digest off'}</span><strong>${esc(s.name)}</strong><p>${esc(s.keyword||'All keywords')} ${s.size?'· Size '+esc(s.size):''} ${s.max?'· Under '+s.max+' kr':''}</p><div class="inline" style="justify-content:space-between;margin-top:17px"><span class="count">${filteredSearch(s).length} <span class="small muted">matches</span></span><span>→</span></div></div>`).join('')}<div class="tile" onclick="openSearch()"><strong style="font-size:28px">＋</strong><strong>Create search</strong><p>Keywords, brand, size and budget</p></div></div>`}if(page==='Daily Drops'){let following=list.filter(x=>data.following.includes(x.brand)&&x.age<=1),fresh=list.filter(x=>x.age<=1),rare=list.filter(x=>x.rarity>=9&&x.age<=1),hits=data.searches.filter(s=>s.alerts).flatMap(s=>filteredSearch(s).filter(x=>x.age<=1));let ids=new Set([...(data.digest.following?following:[]),...(data.digest.styles?fresh:[]),...(data.digest.rare?rare:[]),...(data.digest.searches?hits:[])].map(x=>x.id));return header('Daily Drops','A quiet, once-a-day summary of items matching your interests.',`<button class="btn light" onclick="navigate('Settings')">Digest settings</button>`)+`<div class="notice">Preview only · Scheduled delivery is not active. These counts come from sample data, not live listings.</div><div class="three"><div class="panel"><div class="stat">${fresh.length}</div><p>Recently added examples</p></div><div class="panel"><div class="stat">${following.length}</div><p>From followed brands</p></div><div class="panel"><div class="stat">${rare.length}</div><p>Potential rare finds</p></div></div>`+title('Your digest preview')+grid(list.filter(x=>ids.has(x.id)).sort((a,b)=>a.age-b.age))}if(page==='My Styles'){return header('My Styles','Manually manage your aesthetics and explore suggested styles.',`<button class="btn" onclick="modal='style';render()">+ Create style</button>`)+`<div class="cards">${data.styles.map(s=>`<div class="tile"><span class="eyebrow">STYLE FEED</span><strong>${esc(s)}</strong><p>${visible().filter(x=>x.style===s).length} matching sample pieces</p><div class="inline" style="margin-top:15px"><button class="btn light" onclick="styleFilter=decodeURIComponent('${encodeURIComponent(s)}');navigate('Discover')">View feed</button><button class="btn light" onclick="removeStyle('${encodeURIComponent(s)}')">Remove</button></div></div>`).join('')}</div>`+title('AI-assisted suggestions — simulated')+`<div class="notice">These suggestions are illustrative rules, not generated by a live AI service. A future version can infer styles from items you save and your feedback.</div><div class="cards">${['Quiet Luxury','Avant-Garde','Vintage Sportswear','Modern Tailoring'].filter(s=>!data.styles.includes(s)).map(s=>`<div class="tile"><strong>${s}</strong><p>Suggested aesthetic to explore</p><button class="btn light" style="margin-top:15px" onclick="addStyle('${encodeURIComponent(s)}')">+ Add style</button></div>`).join('')}</div>`}if(page==='Brands'){let brands=[...new Set([...items.map(x=>x.brand),...data.following,...data.excluded])].sort();if(brandTab==='Following')brands=brands.filter(x=>data.following.includes(x));if(brandTab==='Excluded')brands=brands.filter(x=>data.excluded.includes(x));brands=brands.filter(x=>x.toLowerCase().includes(query.toLowerCase()));return header('Brand Management','Follow brands, exclude unwanted labels, or leave them neutral.')+`<div class="panel"><div class="inline"><input id="brandinput" placeholder="Add a brand name…" onkeydown="if(event.key==='Enter')addBrand()"><button class="btn" onclick="addBrand()">Add brand</button></div><p class="small" style="margin-top:9px">Adding a brand marks it as followed. You can change its status below.</p></div>`+chips(['All','Following','Excluded'],brandTab,'setBrandTab')+`<div class="panel"><div class="field"><input placeholder="Find a brand…" value="${esc(query)}" oninput="query=this.value;renderPreserveFocus()" id="brandfilter"></div>${brands.map(b=>`<div class="brandrow"><div><strong>${esc(b)}</strong> <span class="state ${data.excluded.includes(b)?'exclude':data.following.includes(b)?'follow':''}">${data.excluded.includes(b)?'Excluded':data.following.includes(b)?'Following':'Neutral'}</span></div><div class="actions"><button class="${data.following.includes(b)?'on':''}" onclick="setBrand('${encodeURIComponent(b)}','follow')">Follow</button><button class="${data.excluded.includes(b)?'on':''}" onclick="setBrand('${encodeURIComponent(b)}','exclude')">Exclude</button><button onclick="setBrand('${encodeURIComponent(b)}','neutral')">Neutral</button></div></div>`).join('')}</div>`}if(page==='Settings'){return header('Settings','Manage your digest preferences and prototype data.')+`<div class="two"><div class="panel"><h3>Daily digest</h3><p class="small">Select which content appears in your preview.</p>${[['following','New items from followed brands'],['searches','Matches from saved searches'],['rare','Potential rare finds'],['styles','New items matching my styles']].map(([k,v])=>`<label class="checkline"><input type="checkbox" ${data.digest[k]?'checked':''} onchange="data.digest.${k}=this.checked;persist()">${v}</label>`).join('')}<div class="field"><label>Preferred delivery time (future integration)</label><input type="time" value="${data.digestTime}" onchange="data.digestTime=this.value;persist()"></div><div class="notice">No emails, push notifications or scheduled jobs are sent in this prototype.</div></div><div class="panel"><h3>Prototype data</h3><p class="small" style="margin-bottom:16px">Your changes are stored only in this browser. Different devices will not synchronize until we add accounts and a database.</p><button class="btn danger" onclick="resetAll()">Reset prototype preferences</button><div class="footnote">All product imagery is illustrative; product names, prices, rarity and availability are fictional examples. This prototype is not affiliated with Vinted.</div></div></div>`}return ''}
function modalContent(){if(!modal)return '';if(modal==='style')return `<div class="modalback" onclick="closeModal(event)"><div class="modal"><div class="modalhead"><h2>Create a style</h2><button onclick="modal='';render()">×</button></div><form onsubmit="event.preventDefault();const s=this.elements.name.value.trim();if(s)addStyle(encodeURIComponent(s))"><div class="field"><label>Style name</label><input name="name" required placeholder="e.g. Vintage Workwear" autofocus></div><button class="btn">Create style</button></form></div></div>`;if(modal==='search'){let s=data.searches.find(x=>x.id===editSearch)||{name:'',keyword:'',brand:'',size:'',max:'',alerts:true};return `<div class="modalback" onclick="closeModal(event)"><div class="modal"><div class="modalhead"><h2>${editSearch?'Edit':'Create'} saved search</h2><button onclick="modal='';render()">×</button></div><form onsubmit="saveSearch(event)"><div class="field"><label>Search name</label><input name="name" required value="${esc(s.name)}" placeholder="e.g. Brown leather jackets"></div><div class="field"><label>Keywords (item, style or category)</label><input name="keyword" value="${esc(s.keyword)}" placeholder="e.g. leather"></div><div class="field"><label>Brand (optional)</label><input name="brand" value="${esc(s.brand)}" placeholder="e.g. Our Legacy"></div><div class="two"><div class="field"><label>Size (optional)</label><input name="size" value="${esc(s.size)}" placeholder="M"></div><div class="field"><label>Maximum price, SEK</label><input type="number" min="0" name="max" value="${esc(s.max)}" placeholder="2500"></div></div><label class="checkline"><input type="checkbox" name="alerts" ${s.alerts?'checked':''}> Include new matches in daily digest</label><div class="inline"><button class="btn">${editSearch?'Save changes':'Create search'}</button>${editSearch?`<button type="button" class="btn danger" onclick="deleteSearch(${editSearch})">Delete search</button>`:''}</div></form></div></div>`}return ''}
function render(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="logo">FORME</div><div class="sublogo">Secondhand discovery</div><nav class="nav">${nav.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="navigate('${n}')"><span>${i}</span>${n}</button>`).join('')}</nav><div class="sidebottom">PROTOTYPE / V1<br>Sample listings · Local preferences<br>Not connected to Vinted</div></aside><main class="main"><div class="topbar"><div><strong style="letter-spacing:.15em">FORME</strong> <span class="eyebrow">/ PROTOTYPE</span></div><div class="topright"><span class="pill">🇸🇪 Sweden · SEK</span><button class="chip" onclick="navigate('Saved Items')">♡ ${data.saved.length}</button></div></div><div class="content">${mainContent()}<div class="footnote">FORME prototype · Illustrative listings only · No live availability or Vinted integration</div></div></main></div><nav class="mobilebar">${[['Discover','⌕'],['Following','♡'],['Saved Searches','▤'],['Daily Drops','◷'],['Brands','☷'],['My Styles','◈']].map(([n,i])=>`<button class="${page===n?'active':''}" onclick="navigate('${n}')"><b>${i}</b>${n==='Saved Searches'?'Searches':n==='Daily Drops'?'Drops':n==='My Styles'?'Styles':n}</button>`).join('')}</nav>${modalContent()}${toast?`<div class="toast">${esc(toast)}</div>`:''}`}
function navigate(n){page=n;activeSearch=null;query='';render();scrollTo(0,0)}function setStyle(s){styleFilter=decodeURIComponent(s);render()}function setBrandTab(s){brandTab=decodeURIComponent(s);render()}function renderPreserveFocus(){let el=document.activeElement,pos=el.selectionStart;render();let n=document.getElementById('brandfilter');n.focus();n.setSelectionRange(pos,pos)}function setBrand(b,state){b=decodeURIComponent(b);data.following=data.following.filter(x=>x!==b);data.excluded=data.excluded.filter(x=>x!==b);if(state==='follow')data.following.push(b);if(state==='exclude')data.excluded.push(b);persist();render()}function addBrand(){let b=document.getElementById('brandinput').value.trim();if(!b)return;let existing=[...data.following,...data.excluded,...items.map(x=>x.brand)].find(x=>x.toLowerCase()===b.toLowerCase());setBrand(encodeURIComponent(existing||b),'follow');notify('Brand added to Following')}function toggleSave(id){data.saved=data.saved.includes(id)?data.saved.filter(x=>x!==id):[...data.saved,id];persist();render()}function addStyle(s){s=decodeURIComponent(s);if(!data.styles.includes(s))data.styles.push(s);modal='';persist();notify('Style added')}function removeStyle(s){s=decodeURIComponent(s);if(!confirm('Remove '+s+' from your style feeds?'))return;data.styles=data.styles.filter(x=>x!==s);if(styleFilter===s)styleFilter='All';persist();render()}function openSearch(id){editSearch=id||null;modal='search';render()}function closeModal(e){if(e.target.classList.contains('modalback')){modal='';render()}}function saveSearch(e){e.preventDefault();let f=e.target.elements,s={id:editSearch||Date.now(),name:f.name.value.trim(),keyword:f.keyword.value.trim(),brand:f.brand.value.trim(),size:f.size.value.trim(),max:f.max.value,alerts:f.alerts.checked};if(editSearch)data.searches=data.searches.map(x=>x.id===editSearch?s:x);else data.searches.push(s);modal='';activeSearch=s.id;persist();notify('Search saved')}function deleteSearch(id){if(!confirm('Delete this saved search?'))return;data.searches=data.searches.filter(s=>s.id!==id);activeSearch=null;modal='';persist();notify('Search deleted')}function toggleSearchAlert(id){data.searches=data.searches.map(s=>s.id===id?{...s,alerts:!s.alerts}:s);persist();render()}function resetAll(){if(!confirm('Reset all prototype preferences?'))return;data=structuredClone(defaults);persist();navigate('Discover')};render();
</script></body></html>
